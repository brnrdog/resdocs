version: 2
updates:
  # Runtime and build dependencies. ReScript and xote move together
  # with the viewer, so review those bumps against the smoke test.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      markdown:
        patterns: ["unified", "remark-*"]
      dev:
        dependency-type: development
    open-pull-requests-limit: 5

  # Actions used by the workflows and by action.yml.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
