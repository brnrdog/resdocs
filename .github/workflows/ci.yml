name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Install Chromium for the benchmark
        run: npx playwright install --with-deps chromium
      - name: Benchmark on the xote bundle
        run: |
          node bench/bench.mjs | tee bench.md
          echo "## Benchmark" >> "$GITHUB_STEP_SUMMARY"
          cat bench.md >> "$GITHUB_STEP_SUMMARY"
