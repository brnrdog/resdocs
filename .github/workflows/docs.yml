# Dogfood: documents xote and rescript-signals with the action in this
# repository and publishes both under one GitHub Pages site.
name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: brnrdog/xote
          path: deps/xote

      - uses: actions/checkout@v7
        with:
          repository: brnrdog/rescript-signals
          path: deps/rescript-signals

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install the packages under documentation
        run: |
          (cd deps/xote && npm ci)
          (cd deps/rescript-signals && npm ci)

      - name: Document xote
        uses: ./
        with:
          project: deps/xote
          out: site/xote
          base: /resdocs/xote/
          hub: /resdocs/
          repo: https://github.com/brnrdog/xote
          ref: main
          exclude: Runtime*
          deploy: "false"

      - name: Document rescript-signals
        uses: ./
        with:
          project: deps/rescript-signals/packages/rescript-signals
          out: site/rescript-signals
          base: /resdocs/rescript-signals/
          hub: /resdocs/
          repo: https://github.com/brnrdog/rescript-signals
          ref: main
          dir: packages/rescript-signals
          deploy: "false"

      - name: Write the package index
        uses: ./
        with:
          command: hub
          out: site
          base: /resdocs/
          title: ReScript API docs
          tagline: Generated API documentation for ReScript packages.
          deploy: "false"

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
