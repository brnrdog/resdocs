name: resdocs
description: >-
  Build HexDocs-style documentation for a ReScript package and publish
  it to GitHub Pages.
author: brnrdog
branding:
  icon: book-open
  color: purple

inputs:
  command:
    description: >-
      "build" documents one package. "hub" writes an index page over a
      directory that already holds one built package per subdirectory.
    default: build
  project:
    description: Path to the ReScript package (the directory with rescript.json).
    default: "."
  out:
    description: Directory the site is written to.
    default: docs-site
  base:
    description: URL path the site is served from. Defaults to /<repository name>/.
    default: ""
  repo:
    description: GitHub repository URL for source links. Defaults to this repository.
    default: ""
  ref:
    description: Git ref for source links. Defaults to the commit being built.
    default: ""
  dir:
    description: Package directory inside the repository, for monorepos.
    default: ""
  hub:
    description: >-
      Link back to the package index this site belongs to, for sites
      that are part of a multi-package hub.
    default: ""
  title:
    description: Site title. Defaults to the package name.
    default: ""
  tagline:
    description: One line under the heading, for the hub command.
    default: ""
  exclude:
    description: Comma separated module name patterns to skip, such as Runtime*.
    default: ""
  strict:
    description: Fail the build when a public item has no docstring.
    default: "false"
  deploy:
    description: Upload the site and deploy it to GitHub Pages.
    default: "true"
  node-version:
    description: Node.js version.
    default: "22"

outputs:
  page_url:
    description: URL of the deployed site, when deploy is true.
    value: ${{ steps.deployment.outputs.page_url }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}

    # A release tag (brnrdog/resdocs@v0.1) carries the compiled CLI and
    # the built viewer, so only runtime dependencies are installed. A
    # branch (@main) has neither and is built here, which is slower.
    - name: Install resdocs
      shell: bash
      env:
        RESDOCS_ACTION_PATH: ${{ github.action_path }}
      run: |
        cd "$RESDOCS_ACTION_PATH"
        if [ -f src/cli/Cli.res.mjs ] && [ -f dist/viewer/index.html ]; then
          npm ci --omit=dev --ignore-scripts
        else
          npm ci
        fi

    - name: Install project dependencies
      if: inputs.command == 'build'
      shell: bash
      env:
        RESDOCS_PROJECT: ${{ inputs.project }}
      run: |
        cd "$RESDOCS_PROJECT"
        if [ ! -d node_modules ]; then
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
        fi

    # Inputs reach the script only through the environment, never
    # through expressions inside `run`, so a quote or $( in a title cannot
    # become shell code.
    - name: Build documentation
      shell: bash
      env:
        RESDOCS_COMMAND: ${{ inputs.command }}
        RESDOCS_PROJECT: ${{ inputs.project }}
        RESDOCS_OUT: ${{ inputs.out }}
        RESDOCS_BASE: ${{ inputs.base }}
        RESDOCS_REPO: ${{ inputs.repo }}
        RESDOCS_REF: ${{ inputs.ref }}
        RESDOCS_DIR: ${{ inputs.dir }}
        RESDOCS_HUB: ${{ inputs.hub }}
        RESDOCS_TITLE: ${{ inputs.title }}
        RESDOCS_TAGLINE: ${{ inputs.tagline }}
        RESDOCS_EXCLUDE: ${{ inputs.exclude }}
        RESDOCS_STRICT: ${{ inputs.strict }}
        RESDOCS_ACTION_PATH: ${{ github.action_path }}
      run: |
        base="$RESDOCS_BASE"
        if [ -z "$base" ]; then base="/${GITHUB_REPOSITORY#*/}/"; fi
        if [ "$RESDOCS_COMMAND" = "hub" ]; then
          args=(hub --out "$RESDOCS_OUT" --base "$base")
          if [ -n "$RESDOCS_TITLE" ]; then args+=(--title "$RESDOCS_TITLE"); fi
          if [ -n "$RESDOCS_TAGLINE" ]; then args+=(--tagline "$RESDOCS_TAGLINE"); fi
        elif [ "$RESDOCS_COMMAND" = "build" ]; then
          repo="$RESDOCS_REPO"
          if [ -z "$repo" ]; then repo="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"; fi
          ref="$RESDOCS_REF"
          if [ -z "$ref" ]; then ref="$GITHUB_SHA"; fi
          args=(build --project "$RESDOCS_PROJECT" --out "$RESDOCS_OUT"
                --base "$base" --repo "$repo" --ref "$ref")
          if [ -n "$RESDOCS_DIR" ]; then args+=(--dir "$RESDOCS_DIR"); fi
          if [ -n "$RESDOCS_HUB" ]; then args+=(--hub "$RESDOCS_HUB"); fi
          if [ -n "$RESDOCS_TITLE" ]; then args+=(--title "$RESDOCS_TITLE"); fi
          if [ -n "$RESDOCS_EXCLUDE" ]; then args+=(--exclude "$RESDOCS_EXCLUDE"); fi
          if [ "$RESDOCS_STRICT" = "true" ]; then args+=(--strict); fi
        else
          echo "resdocs: unknown command: $RESDOCS_COMMAND (expected build or hub)" >&2
          exit 2
        fi
        node "$RESDOCS_ACTION_PATH/bin/resdocs.mjs" "${args[@]}"

    - if: inputs.deploy == 'true'
      uses: actions/configure-pages@v6

    - if: inputs.deploy == 'true'
      uses: actions/upload-pages-artifact@v5
      with:
        path: ${{ inputs.out }}

    - if: inputs.deploy == 'true'
      id: deployment
      uses: actions/deploy-pages@v5
