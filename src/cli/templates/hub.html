<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>__HUB_TITLE__</title>
    <meta name="description" content="API documentation for ReScript packages." />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/svg+xml" href="__HUB_BASE__logo.svg" />
    <script>
      try {
        var t = localStorage.getItem("resdocs-theme");
        if (!t && matchMedia("(prefers-color-scheme: dark)").matches) t = "dark";
        document.documentElement.setAttribute("data-theme", t || "light");
      } catch (e) {}
    </script>
    <style>
      :root {
        --brand: #e6484f;
        --bg: #ffffff;
        --surface: #f7f8fa;
        --border: #e5e7eb;
        --border-subtle: #eef0f3;
        --ink: #333846;
        --ink-strong: #23283a;
        --muted: #666d7d;
        --link: #a83c42;
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      :root[data-theme="dark"] {
        --bg: #14162c;
        --surface: #1a1d33;
        --border: #2a2d45;
        --border-subtle: #22253c;
        --ink: #c9cedd;
        --ink-strong: #dfe3ed;
        --muted: #868ea3;
        --link: #e8949a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        font-size: 16px;
        line-height: 1.65;
        color: var(--ink);
        background: var(--bg);
        -webkit-font-smoothing: antialiased;
      }
      a { color: var(--link); text-decoration: none; }
      a:hover { text-decoration: underline; text-underline-offset: 2px; }
      .header {
        display: flex;
        align-items: center;
        gap: 9px;
        height: 56px;
        padding: 0 20px;
        border-bottom: 1px solid var(--border);
      }
      .header strong { color: var(--ink-strong); font-size: 15px; font-weight: 600; }
      .header svg { color: var(--brand); }
      main { max-width: 46rem; margin: 0 auto; padding: 56px 20px 120px; }
      h1 { margin: 0; font-size: 30px; font-weight: 600; letter-spacing: -0.02em; color: var(--ink-strong); }
      .tagline { margin: 10px 0 0; color: var(--muted); }
      .packages { list-style: none; padding: 0; margin: 40px 0 0; }
      .card {
        display: block;
        padding: 16px 0;
        border-top: 1px solid var(--border-subtle);
        border-left: 2px solid transparent;
      }
      .card:hover { text-decoration: none; background: var(--surface); }
      .card-name { font-family: var(--mono); font-size: 14px; color: var(--ink-strong); }
      .card:hover .card-name { color: var(--link); }
      .card-version { margin-left: 8px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
      .card-summary { display: block; margin-top: 3px; color: var(--muted); font-size: 14px; }
      .card-counts { display: block; margin-top: 4px; font-size: 12.5px; color: var(--muted); }
      footer { margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--border); color: var(--muted); font-size: 14px; }
      @media (max-width: 600px) { main { padding: 32px 16px 72px; } h1 { font-size: 25px; } }
    </style>
  </head>
  <body>
    <header class="header">__HUB_LOGO__<strong>resdocs</strong></header>
    <main>
      <h1>__HUB_TITLE__</h1>
      <p class="tagline">__HUB_TAGLINE__</p>
      <ul class="packages">__HUB_PACKAGES__</ul>
      <footer>
        Generated by <a href="https://github.com/brnrdog/resdocs">resdocs</a>.
      </footer>
    </main>
  </body>
</html>
