<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>__HUB_TITLE__</title>
    <meta name="description" content="API documentation for ReScript packages." />
    <meta name="theme-color" content="#14162c" />
    <link rel="icon" type="image/svg+xml" href="__HUB_BASE__logo.svg" />
    <script>
      try {
        var t = localStorage.getItem("resdocs-theme");
        if (!t && matchMedia("(prefers-color-scheme: dark)").matches) t = "dark";
        document.documentElement.setAttribute("data-theme", t || "light");
      } catch (e) {}
    </script>
    <style>
      :root {
        --brand: #e6484f;
        --navy: #14162c;
        --bg: #ffffff;
        --bg-muted: #f3f5f9;
        --bg-header: var(--navy);
        --fg: var(--navy);
        --fg-muted: #59636e;
        --border: #d5d7db;
        --accent: #ba262d;
        --accent-bg: #fdeceb;
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      :root[data-theme="dark"] {
        --bg: var(--navy);
        --bg-muted: #1a1d33;
        --bg-header: #101223;
        --fg: #eceef6;
        --fg-muted: #9aa4b2;
        --border: #2b2e4a;
        --accent: #ff7a80;
        --accent-bg: #2e1d26;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        font-size: 15px;
        line-height: 1.6;
        color: var(--fg);
        background: var(--bg);
        -webkit-font-smoothing: antialiased;
      }
      a { color: var(--accent); text-decoration: none; }
      a:hover { text-decoration: underline; }
      .header {
        display: flex;
        align-items: center;
        gap: 9px;
        height: 60px;
        padding: 0 20px;
        color: #fff;
        background: var(--bg-header);
        border-bottom: 1px solid var(--border);
      }
      .header strong { font-size: 16px; letter-spacing: -0.01em; }
      .header svg { color: var(--brand); }
      main { max-width: 820px; margin: 0 auto; padding: 48px 20px 96px; }
      h1 { font-size: 30px; margin: 0; }
      .tagline { margin: 10px 0 0; font-size: 16px; color: var(--fg-muted); }
      .packages { list-style: none; padding: 0; margin: 36px 0 0; display: grid; gap: 10px; }
      .card {
        display: block;
        padding: 14px 16px;
        border: 1px solid var(--border);
      }
      .card:hover { border-color: var(--brand); text-decoration: none; }
      .card-name { font-family: var(--mono); font-weight: 600; color: var(--accent); }
      .card-version {
        margin-left: 8px;
        padding: 1px 7px;
        font-size: 11px;
        color: var(--fg-muted);
        border: 1px solid var(--border);
        border-radius: 999px;
      }
      .card-summary { display: block; margin-top: 3px; color: var(--fg-muted); font-size: 14px; }
      .card-counts { display: block; margin-top: 6px; font-size: 12px; color: var(--fg-muted); }
      footer { margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--border); color: var(--fg-muted); font-size: 13px; }
      @media (max-width: 600px) { main { padding: 28px 16px 64px; } h1 { font-size: 24px; } }
    </style>
  </head>
  <body>
    <header class="header">__HUB_LOGO__<strong>resdocs</strong></header>
    <main>
      <h1>__HUB_TITLE__</h1>
      <p class="tagline">__HUB_TAGLINE__</p>
      <ul class="packages">__HUB_PACKAGES__</ul>
      <footer>
        Generated by <a href="https://github.com/brnrdog/resdocs">resdocs</a>.
      </footer>
    </main>
  </body>
</html>
